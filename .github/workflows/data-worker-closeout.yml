name: data worker closeout

# Read-only verification of the historical replay. Decrypts the sealed checkpoint and output
# artifacts on the runner with WORKER_ARTIFACT_KEY (never printed), compares them with the
# expected session set from the database, and writes the verdict to the job summary.
# It replays nothing and writes nothing to the database or the repository.
on:
  workflow_dispatch:
    inputs:
      from:
        required: false
        default: "2019-01-02"
      to:
        required: false
        default: "2026-09-01"
      checkpoint:
        description: "Primary checkpoint namespace to verify."
        required: false
        default: "nbt-fullhistory-checkpoint"
      also:
        description: "Space-separated further checkpoint namespaces to report alongside."
        required: false
        default: "nbt-worker-checkpoint"

concurrency:
  group: nbt-data-worker-closeout
  cancel-in-progress: false

# actions: read lists and downloads artifacts; no write access of any kind.
permissions:
  contents: read
  actions: read

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prove this run is executing main
        run: |
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not main"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Download the sealed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CKPT: ${{ inputs.checkpoint }}
          ALSO: ${{ inputs.also }}
        run: |
          mkdir -p sealed
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | [.id,.name,.created_at] | @tsv' > list.tsv
          # newest checkpoint of each requested namespace
          for n in "$CKPT" $ALSO; do
            ck="$(awk -F'\t' -v n="$n" '$2==n' list.tsv | sort -t"$(printf '\t')" -k3 | tail -1 | cut -f1)"
            [ -n "$ck" ] || { echo "no checkpoint artifact named $n"; continue; }
            gh api "repos/${{ github.repository }}/actions/artifacts/$ck/zip" > "sealed/ckpt-$n.zip"
            echo "checkpoint $n -> artifact id $ck"
          done
          [ -f "sealed/ckpt-$CKPT.zip" ] || { echo "primary checkpoint $CKPT missing"; exit 1; }
          # every output artifact
          awk -F'\t' '$2 ~ /^nbt-worker-output-/ {print $1" "$2}' list.tsv | while read id name; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "sealed/$name.zip"
            echo "output artifact $name (id $id)"
          done

      - name: Decrypt and verify
        env:
          KEY: ${{ secrets.WORKER_ARTIFACT_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          [ -n "$KEY" ] || { echo "WORKER_ARTIFACT_KEY not set"; exit 1; }
          mkdir -p ck outputs
          args=""
          for z in sealed/ckpt-*.zip; do
            n="$(basename "$z" .zip)"; n="${n#ckpt-}"; mkdir -p "ck/$n"
            unzip -q "$z" -d "ck/$n"
            sha256sum "ck/$n/checkpoint.json.enc" | sed "s/^/sealed sha256 checkpoint:$n /" >> sealed-hashes.txt
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY \
              -in "ck/$n/checkpoint.json.enc" -out "ck/$n/checkpoint.json"
            args="$args --checkpoint $n=ck/$n/checkpoint.json"
          done
          for z in sealed/nbt-worker-output-*.zip; do
            n="$(basename "$z" .zip)"; mkdir -p "enc/$n" "outputs/$n"
            unzip -q "$z" -d "enc/$n"
            sha256sum "enc/$n/output.tar.gz.enc" | sed "s/^/sealed sha256 $n /" >> sealed-hashes.txt
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY \
              -in "enc/$n/output.tar.gz.enc" | tar -xzf - -C "outputs/$n"
          done
          set +e
          python tools/closeout.py $args --primary "${{ inputs.checkpoint }}" --outputs outputs \
            --from "${{ inputs.from }}" --to "${{ inputs.to }}" | tee report.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_ENV"


      - name: Summary
        if: always()
        run: |
          { echo "## data worker closeout"; echo '```'; cat report.txt 2>/dev/null; echo '```';
            echo "### sealed artifact sha256"; echo '```'; cat sealed-hashes.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Seal the manifest
        if: always()
        env:
          KEY: ${{ secrets.WORKER_ARTIFACT_KEY }}
        run: |
          [ -f closeout.json ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:KEY -in closeout.json -out closeout.json.enc || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbt-worker-closeout-${{ github.run_id }}
          path: closeout.json.enc
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the run unless the verdict is PASS
        run: '[ "${rc:-1}" = "0" ]'
