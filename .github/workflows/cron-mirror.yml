name: cron mirror

# Keep the standbys current: copy the irreplaceable tables from the primary into every configured
# standby, one way and additively.
#
# What this is for. Two or more separate Postgres projects do not replicate, so a standby is only as
# good as the last time something copied into it. `lib/failover.ts` will route the site's reads to a
# standby when the primary cannot be reached, and what it finds there is what this left. A standby
# that was never refreshed serves a site frozen at the day it was last copied.
#
# Why it is a nightly window and not a full copy. The first run is a full copy and takes most of an
# hour; every run after that carries only what could have changed. Prices are written once and then
# only revised for a few days, so a week is generous. DecisionLog rows are *updated* for a month after
# they are written, as the +1, +5 and +20 session outcomes land, so its window has to reach past the
# longest maturation -- a short window would freeze a decision's outcome at whatever it was the last
# time the window covered it, which is the one table where that is not recoverable.
#
# Placed after the decision lane. `cron decision` starts at 22:10 UTC and its two jobs have a budget
# of 45 minutes between them, so by 23:40 the day's rows exist.
#
# Skips cleanly when no standby is configured. A workflow that failed every night on a deployment
# that has chosen not to run a standby would be noise that trains people to ignore a red run, and
# the retry lane would then re-run it.
on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Copy prices from this day (YYYY-MM-DD) instead of the trailing week: a new standby's first full copy"
        required: false
        default: ""

concurrency:
  group: nbt-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: copy into the standbys
    runs-on: ubuntu-latest
    # A full first copy into a new standby takes most of an hour from a runner; the nightly window is minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          want="$(git rev-parse origin/main)"
          if [ "$head" != "$want" ]; then
            echo "this run is NOT executing main, refusing to continue"
            exit 1
          fi
          echo "confirmed: this run is executing main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      # Names which standbys are configured, by name only. The values never leave the environment: the
      # job below reads them there, and the mirror redacts a connection string from anything it prints.
      - name: Check which standbys are configured
        id: targets
        env:
          NEON2: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPA: ${{ secrets.SUPABASE_DATABASE_URL }}
          PRIMARY_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # A standby that is the primary itself is not a target: Supabase can be made the primary
          # (brain.md rule 88), and mirror.py refuses the whole run when a target is its source.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          primary="$(trim "$PRIMARY_URL")"
          names=""
          [ -n "$NEON2" ] && [ "$(trim "$NEON2")" != "$primary" ] && names="DATABASE_URL_FALLBACK"
          if [ -n "$SUPA" ] && [ "$(trim "$SUPA")" != "$primary" ]; then
            names="${names:+$names,}SUPABASE_DATABASE_URL"
          fi
          if [ -z "$names" ]; then
            echo "::notice::no standby is configured (DATABASE_URL_FALLBACK and SUPABASE_DATABASE_URL are both empty), so there is nothing to mirror into"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured: $names"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "names=$names" >> "$GITHUB_OUTPUT"
          fi

      # Rows the lanes wrote to the standby during an outage go back to the primary first
      # (jobs/reconcile.py). The copies below run primary to standby; without this they would put the
      # primary's older values over the standby's newer ones -- an outcome measured during the outage,
      # say, overwritten with the null the primary still held.
      - name: Copy the standby's outage rows back first
        if: steps.targets.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/reconcile.py

      - name: Prices, a trailing week
        if: steps.targets.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
          SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          # A dispatched start day (validated, never pasted into the script) or the trailing week.
          if [[ "$SINCE_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then since="$SINCE_INPUT"; else since="$(date -u -d '7 days ago' +%Y-%m-%d)"; fi
          python jobs/mirror.py --from-env DATABASE_URL --to-env "${{ steps.targets.outputs.names }}" \
            --tables Asset,PriceSnapshot --since "$since"

      # `always()`: a failed price copy must not skip the decisions. On 2026-10-10 the prices step timed
      # out and this step was skipped with it, so a standby that already held every price received no
      # decisions at all -- and DecisionLog's matured outcomes are the one table that cannot be rebuilt.
      # MacroGate rides here too: its vetoes are inputs to the call, and a standby without them prints a
      # direction the primary refused.
      - name: Decisions, signals, theses and vetoes, a trailing 40 days
        if: always() && steps.targets.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          since="$(date -u -d '40 days ago' +%Y-%m-%d)"
          python jobs/mirror.py --from-env DATABASE_URL --to-env "${{ steps.targets.outputs.names }}" \
            --tables DecisionLog,SignalLog,AssetThesis,MacroGate --since "$since"

      # News coverage (brain.md rule 93). `always()` for the reason above: the rule table reads coverage
      # only to withdraw evidence, so a standby without it would print calls the primary refused. Sixty-one
      # days, the two thirty-day windows `jobs/human.py` reads, so a standby that has to recompute the
      # readings itself has the same headlines to read.
      - name: News headlines and readings, a trailing 61 days
        if: always() && steps.targets.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          since="$(date -u -d '61 days ago' +%Y-%m-%d)"
          python jobs/mirror.py --from-env DATABASE_URL --to-env "${{ steps.targets.outputs.names }}" \
            --tables News,HumanSignal --since "$since"

      # What a failover would serve, reported every night (brain.md rule 94): active assets a standby
      # lacks, and how far each standby's decision inputs lag the primary's. Not a gate on this run --
      # the site publishes no call from a standby read in any case -- but the gap is printed, not found.
      - name: Standby parity
        if: always() && steps.targets.outputs.any == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python tools/standby_parity.py
