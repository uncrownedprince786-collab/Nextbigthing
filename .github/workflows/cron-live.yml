name: cron live quotes

# Keeps one fresh quote per asset in `LiveQuote`, a few minutes old at most. See jobs/live.py for
# what it is, what it is not, and what was measured.
#
# **The platform sets the floor, and it is five minutes.** GitHub Actions does not run a schedule more
# often than every five minutes, and under load a scheduled run can start many minutes late. A
# one-minute tick is not available here and this file does not claim one: the fastest honest cadence is
# `*/5`, and the quote on a page carries the time it was struck so a late tick is visible, not hidden.
#
# Two schedules, because the markets are not open at the same hours:
#   * every 5 minutes through the US session (13:00-21:59 UTC covers both the daylight and the standard
#     time open and close), Monday to Friday: crypto and the active Yahoo slice;
#   * every 15 minutes around the clock: crypto only, which is one request and trades continuously.
# The second keeps the database mostly asleep outside the session -- Neon suspends an idle compute after
# five minutes and a free project has a monthly compute allowance, so a tick every five minutes all
# night would spend it on quotes that a closed market does not change.
#
# **Off until asked.** The job below runs only when the repository variable LIVE_QUOTES is "on", the
# way the macro gate needs MACRO_GATE. It writes one table and nothing else; with it off the site is
# exactly what it was.
#
# Public repository: Actions minutes are not billed. A private one would pay for roughly 200 short runs
# a day and should raise the interval instead of keeping this one.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Its own queue, and a running tick is never cancelled by another. GitHub keeps one pending run per
# group, so a slow provider cannot build a backlog: at most one tick waits behind the one running, and
# the 4 minute timeout means a stuck one cannot hold the queue for long.
concurrency:
  group: nbt-live
  cancel-in-progress: false

jobs:
  live:
    name: one tick of live quotes
    if: ${{ vars.LIVE_QUOTES == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      - name: One tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PYTHONIOENCODING: utf-8
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e
          # The quarter-hour schedule is crypto only; the five-minute and a manual run do the lot.
          only=""
          if [ "$SCHEDULE" = "7,22,37,52 * * * *" ]; then only="--only crypto"; fi
          out="$(python jobs/live.py $only 2>&1)"
          echo "$out"
          {
            echo "## Live quotes"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The job exits 0 by design. A provider that is down must not turn a tick red.
          exit 0
