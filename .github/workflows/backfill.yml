name: backfill

# Fetching a newly added asset's price history is release work, not refresh work.
#
# The nightly refresh runs `psx recent`, which is the right thing every day and the wrong
# thing exactly once: the day the asset list grows, the new symbols have no history at all
# and `recent` only reaches back 120 days. That is why the PSX sectors sat on the site with
# industries, names and a currency note and no prices under any of them — nothing had ever
# fetched them.
#
# So this runs `psx full` when the thing that decides which assets exist actually changes,
# and not on every push. A backfill is idempotent, but it is also about three hundred
# requests to the exchange, and firing that at a source on every commit is the behaviour
# rule 6 in brain.md exists to prevent.
on:
  push:
    branches: [main]
    paths:
      - jobs/psx.py
      - jobs/seed.py
      - .github/workflows/backfill.yml
  workflow_dispatch:

# Shared with the schema and refresh workflows. One database, and a backfill writing prices
# underneath the ranking job reading them is the kind of thing that only breaks sometimes.
concurrency:
  group: nbt-database
  cancel-in-progress: false

jobs:
  backfill:
    name: fetch PSX history and rerank
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # The exchange's published files for past days never change, so the job caches them
      # for a year on disk. Carrying that cache between runs is what keeps a rerun nearly
      # free instead of three hundred requests every time.
      - name: Restore the fetched file cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: psx-http-${{ github.run_id }}
          restore-keys: psx-http-

      - name: Install job dependencies
        run: pip install -r requirements.txt

      - name: Fetch the full PSX history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/psx.py full

      # Prices alone put nothing on the page. A ranking is computed from stored closes, the
      # grade is computed from the ranking, and the written line reads the grade, so the
      # three have to follow the fetch in that order or the sectors stay blank with data
      # sitting behind them.
      - name: Rank
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/rank.py

      - name: Grade the rankings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/confidence.py rankings

      - name: Regenerate the written lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/analysis.py

      - name: Row counts after the run
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/stats.py
