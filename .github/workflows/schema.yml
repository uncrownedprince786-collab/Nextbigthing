name: schema

# The schema has to reach the database before the deploy that depends on it. The pages query
# their tables while Next.js collects page data, so a build that ships ahead of its migration
# fails there rather than serving a broken site — which is safe, but it does mean a release
# that adds a table never lands until something applies the migration.
#
# This is that something, and it runs here because this is the only automated place holding a
# writer credential. Vercel is deliberately given the read-only nbt_readonly role, which has
# no rights to run DDL, so the migration cannot live in the build that needs it.
#
# Seeding follows the migration in the same run because reference rows are part of the shape
# of a release, not part of the data refresh: a new industry with no row in Industry is a
# table the site renders as empty. jobs/seed.py touches no network and every write is an
# upsert, so a push that changes nothing re-seeds to the same rows.

# main only, and deliberately not master as well. The two branches currently point at the
# same commit, so listing both ran this twice for one push: two migrations and two seeds
# against one database, where the second run is pure contention. It is also the branch Vercel
# deploys to production, so it is the one where the schema has to be ahead of the build.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Its own lane, and that is the point.
#
# This used to share `nbt-database` with the refresh and backfill workflows, which deadlocked
# the thing that matters most: a geo backfill hung on rate-limit retries held the group for
# over ninety minutes, and the migration that the deployed site needed sat queued behind it.
# Optional enrichment must never be able to block critical ingestion.
#
# Safe to run alongside them: `prisma migrate deploy` takes a Postgres advisory lock, so two
# migrations cannot interleave, and every job in this workflow writes through ON CONFLICT
# upserts. The one real race is analysis.py, which deletes and rewrites its table inside a
# transaction — two concurrent runs end with one of them winning, which is correct output
# either way, and far better than the schema never arriving at all.
concurrency:
  group: nbt-schema
  cancel-in-progress: false

jobs:
  schema:
    name: migrate and seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Named for the same reason as in refresh.yml: a workflow_dispatch is offered only on
      # the default branch, so a manual migration would otherwise apply master's migrations
      # rather than main's. A push event already checks out the pushed commit, and naming
      # main is a no-op there.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installed from the repo rather than fetched ad hoc, because prisma7.config.ts imports
      # dotenv and prisma/config and the CLI has to match the version the migrations were
      # written with. --ignore-scripts skips generating a client, which no step here needs.
      #
      # npm install rather than npm ci: ci is the stricter command and failed on the runner
      # while succeeding locally, and the logs for it are not readable without a sign-in.
      # install is the command Vercel already runs against this lockfile on Linux on every
      # deploy, so it is the one with evidence behind it.
      - name: Install the Prisma CLI
        run: npm install --ignore-scripts --no-audit --no-fund

      # The command's own output is copied to the run summary, which is readable without a
      # GitHub sign-in where the log is not.
      #
      # This is not instrumentation for its own sake. This step failed twice in twelve seconds
      # while every step around it passed, and the only published detail was "Process completed
      # with exit code 1" — so the one question that mattered, *why*, was unanswerable from
      # outside the account. A migration is the step the deployed site depends on most; when it
      # fails it has to say so somewhere a maintainer can actually read.
      #
      # `set +e` and the explicit exit keep the step's pass/fail exactly as it was: the summary
      # is written either way, and a failure still fails the run.
      - name: Apply pending schema migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          out="$(npx prisma migrate deploy 2>&1)"
          code=$?
          echo "$out"
          {
            echo "## Migration"
            echo
            echo "exit code \`$code\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      - name: Seed the reference lists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/seed.py

      # The written lines are generated, never hand edited, so they are a function of this
      # code and the rows already stored. That makes them part of a release too: a fix to the
      # wording in jobs/analysis.py does nothing until something regenerates the rows, and
      # waiting for the next scheduled refresh would leave the site showing prose the code no
      # longer produces. It is safe to run on its own — it reads stored rows, makes no network
      # request, and deletes and rewrites Analysis inside one transaction, so a failure rolls
      # back rather than leaving the front page half written.
      # Both are arithmetic over rows already stored — human reads News, accuracy reads
      # PriceSnapshot — so neither makes a request and both belong with a release rather
      # than with the rate limited refresh. accuracy follows human so a reading is logged
      # before the job that measures logged readings runs.
      # Before human, because the catalyst decision counts stories and stories do not exist
      # until the headlines have been clustered.
      # Advances dated events and freezes the before-state of any that have passed. Reads
      # stored rows only, so it belongs with a release rather than with the rate limited
      # refresh.
      - name: Advance the event lifecycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/lifecycle.py

      - name: Cluster headlines into stories
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/lineage.py

      - name: Read the current human signal
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/human.py

      - name: Read the near term analogs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/analogs.py

      - name: Measure what followed earlier readings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/accuracy.py

      - name: Read the measured conditions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/setup.py

      # All three read rows already stored and make no request, so they belong with a
      # release rather than with the rate limited refresh. The order is the dependency:
      # thesis reads the setup row written in the step above, and graph walks out from the
      # catalysts human flagged earlier in this run.
      - name: Compare each held state against the day it opened
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/thesis.py

      - name: Split recent moves into market, industry and specific parts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/attribution.py

      - name: Walk today's catalysts across the stored relationships
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/graph.py

      # The longer term read and the target ranges are arithmetic over stored daily closes, so
      # they belong in the release lane. The intraday read is not here: it needs bars that only
      # the refresh lane fetches, and `horizons longer` skips it rather than writing an
      # intraday row from daily data.
      - name: Read the longer term conditions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/horizons.py longer

      - name: Attach measured target ranges
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/horizons.py targets

      # Reads stored evidence only and makes no request, so it belongs in the release lane
      # too. It follows the attribution and target steps because it reasons over both.
      - name: Investigate the material moves
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/investigate.py

      - name: Audit coverage and calibration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/audit.py

      - name: Regenerate the written lines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/analysis.py

      - name: Row counts after the run
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/stats.py
