name: refresh data

# The website only reads rows that a job has already written, so these schedules are the
# whole data pipeline. Daily keeps prices, news and rankings current. The product signals
# run weekly because Reddit and Wikipedia rate limit and a daily request mostly gets 429.

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "43 7 * * 1"
  workflow_dispatch:
    inputs:
      group:
        description: Which group of jobs to run
        required: true
        default: daily
        type: choice
        options: [daily, weekly, seed]
  # Editing this file runs the daily group once, on main. Two reasons, and the second is the
  # awkward one: a change to the pipeline should be proved rather than assumed, and GitHub
  # offers the workflow_dispatch button only on the repository's default branch, so while the
  # default is not main there is otherwise no way to run this on main's code at all.
  # A push event falls through "Choose the run" to daily, which is the group the site depends
  # on; weekly stays on its schedule, because that is the one that asks the rate limited
  # sources for anything.
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh.yml

# Shared with the backfill workflow so two ingestion runs never compete for the same rows.
#
# Deliberately NOT shared with schema.yml. That separation is the P0 rule: optional enrichment
# must never be able to block a migration or critical ingestion, and the 90 minute deadlock a
# hung geo fetch once caused is what it is there to prevent. The migration race that separation
# used to create is gone, because this lane no longer migrates — see the schema check below.
concurrency:
  group: nbt-database
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh (${{ github.event.inputs.group || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # main, explicitly, and this is the fix for a real production hazard rather than a
      # preference about branch names.
      #
      # GitHub takes a scheduled workflow's *file* from the repository's default branch and
      # nowhere else, and by default checks out that same branch's code. The default here is
      # master. So every nightly run was executing whatever master last held, and master stops
      # being the branch anyone pushes to the moment main moves ahead — a pipeline running
      # silently stale code while reporting success.
      #
      # Naming the ref decouples the two: the file may come from the default branch, but the
      # code that runs is main's. The step below proves it, and fails the run if it is ever
      # not true, so this cannot quietly regress.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          want="$(git rev-parse origin/main)"
          echo "checked out $head"
          echo "origin/main  $want"
          if [ "$head" != "$want" ]; then
            echo "this run is NOT executing main, refusing to continue"
            exit 1
          fi
          echo "confirmed: this run is executing main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      # This lane checks the schema; it does not migrate it. The comment that used to sit here
      # said the schema was migrated "here and nowhere else", and that stopped being true when
      # schema.yml took the job. The result was a real production failure: on a push touching
      # this file, both workflows ran `prisma migrate deploy` against one database in the same
      # second, from two different concurrency groups with nothing serialising them. The schema
      # run won and this one died at the migration with every data job skipped (run
      # 36798989654).
      #
      # Migration is now one controlled path — schema.yml — and this lane refuses to start if
      # the schema has not caught up. The check holds no writer privilege, issues no DDL and
      # needs no Node, so it cannot race anything: comparing two lists is not a write.
      - name: Refuse to run against a schema that is behind
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/schemacheck.py

      - name: Choose the run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 7 * * 1" ]; then
            echo "group=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "group=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/run.py "${{ steps.plan.outputs.group }}"

      - name: Row counts after the run
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python jobs/stats.py
