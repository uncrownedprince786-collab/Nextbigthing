name: refresh data

# The website only reads rows that a job has already written, so these schedules are the
# whole data pipeline. Daily keeps prices, news and rankings current. The product signals
# run weekly because Reddit and Wikipedia rate limit and a daily request mostly gets 429.

on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "43 7 * * 1"
  workflow_dispatch:
    inputs:
      group:
        description: Which group of jobs to run
        required: true
        default: daily
        type: choice
        options: [daily, weekly, seed]
  # Editing this file runs the daily group once, on main. Two reasons, and the second is the
  # awkward one: a change to the pipeline should be proved rather than assumed, and GitHub
  # offers the workflow_dispatch button only on the repository's default branch, so while the
  # default is not main there is otherwise no way to run this on main's code at all.
  # A push event falls through "Choose the run" to daily, which is the group the site depends
  # on; weekly stays on its schedule, because that is the one that asks the rate limited
  # sources for anything.
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh.yml

# Shared with the schema workflow, so a migration and a data job never write at the same
# time. See the note there.
concurrency:
  group: nbt-database
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh (${{ github.event.inputs.group || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      # The schema is migrated here and nowhere else. This is the only place that holds the
      # writer credential: Vercel is given the read-only role on purpose, so it cannot run
      # DDL, and a laptop is not in the loop on a scheduled run. Applying it before the jobs
      # is also the order the data needs, since a job cannot write a table that is not there.
      # migrate deploy applies only what has not run yet, so this is a no-op most days.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installed from the repo rather than fetched ad hoc, so the migration runs on the same
      # Prisma version the migrations were written with and the CLI can resolve the datasource
      # config, which imports dotenv and prisma/config. --ignore-scripts skips the postinstall
      # client generation, which a migration does not need. See the note in schema.yml for why
      # this is install rather than ci.
      - name: Install the Prisma CLI
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Apply pending schema migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Choose the run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 7 * * 1" ]; then
            echo "group=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "group=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/run.py "${{ steps.plan.outputs.group }}"

      - name: Row counts after the run
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python jobs/stats.py
