name: cron products

# Product signals, in product chunks. This is the lane that most needed to leave the monolith
# and the one that justifies chunking most plainly.
#
# The product sources are the rate limited ones — Reddit, Wikipedia and Trends — and they fail
# by refusing, not by erroring quickly. A Trends fetch stuck in rate-limit retries once held a
# job, and the concurrency group with it, for over ninety minutes while the migration the
# deployed site needed sat queued behind it. In the old shape that was a P3 enrichment source
# blocking everything. Here it is one chunk of one workflow in a group nothing else shares.
#
# Chunking by product rather than by source keeps each chunk's failure proportional: a 429 on
# one slice leaves the other slice's products with current signals, where a single step asking
# for every product in turn hits the limit partway through and abandons the remainder.
on:
  schedule:
    # Daily at 03:10 UTC. Daily is the honest ceiling: Reddit and Wikipedia rate limit and a
    # daily request already gets 429s often enough that the previous design ran these weekly.
    # Daily is the user's stated band for this lane, so it runs daily with a tolerated failure
    # rather than more often with a guaranteed one. 03:10 UTC is the quietest hour for the other
    # lanes — audit is at 03:35, nothing else is scheduled in hour 3 at all — and minute 10 sits
    # in a gap between the four recurring minutes (05, 20, 35, 50) so nothing starts together.
    - cron: "10 3 * * *"
  workflow_dispatch:

# Its own group, which is the direct fix for the ninety minute deadlock. Enrichment that hangs
# can now only delay enrichment. And because GitHub keeps one pending run per group, a group
# scoped this narrowly is also the only way a queued product run stops being cancelled by the
# next unrelated source to arrive — the `geo.py` failure mode.
concurrency:
  group: nbt-products
  cancel-in-progress: false

jobs:
  products:
    name: product ${{ matrix.part }}
    runs-on: ubuntu-latest
    # Two parts by source, not two chunks. None of signals, marketplace or geo reads --chunk, so the
    # old 1/2 and 2/2 each ran the whole group, and both were cancelled at 30 minutes on every one of
    # their eight runs (2026-10-03 to 10-10) -- geo alone had a 45 minute budget. Now the five signal
    # sources are one job and marketplace plus geo the other; geo is budgeted to stop and write well
    # inside the cap, and run.py stops any step at 27 minutes so it reports a failure, never a cancel.
    timeout-minutes: 35
    strategy:
      # The reason this is a matrix at all. The default would cancel the sibling chunk the
      # moment one chunk was rate limited, which is the coupling this whole split removes.
      fail-fast: false
      # One at a time. Two chunks hitting Reddit and Trends simultaneously from the same runner
      # IP range is the fastest way to turn a chunk-sized 429 into a workflow-sized one, so
      # these are serialised even though they are independent.
      max-parallel: 1
      matrix:
        part: [signals, geo]
    steps:
      # main, explicitly. GitHub reads a scheduled workflow's file from the default branch,
      # `master`, and defaults to running that branch's code; `master` was 34 commits behind
      # `main` on 2026-10-03, so guards that read correctly in the tree had never executed. The
      # step below proves which commit this is and fails if it is not main's.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          want="$(git rev-parse origin/main)"
          echo "checked out $head"
          echo "origin/main  $want"
          if [ "$head" != "$want" ]; then
            echo "this run is NOT executing main, refusing to continue"
            exit 1
          fi
          echo "confirmed: this run is executing main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      # Checks the schema, never migrates it. `schema.yml` is the single migrator and run
      # 36798989654 is the cost of a second. Comparing two lists is not a write.
      - name: Refuse to run against a schema that is behind
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRIMARY: ${{ vars.PRIMARY }}
          PYTHONIOENCODING: utf-8
        run: python jobs/schemacheck.py

      # The part goes in as a run.py group (`product-signals`, `product-geo`), selections over the
      # one PRODUCTS list. Streamed through tee for the reason cron-news.yml gives: a captured run
      # that is cut off prints nothing. The summary heading names the part so the two read apart.
      - name: Fetch product signals for this part
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          PYTHONIOENCODING: utf-8
          NBT_STEP_TIMEOUT_MIN: "27"
          GEO_FETCH_BUDGET_MIN: "18"
        run: |
          set +e
          python -u jobs/run.py product-${{ matrix.part }} 2>&1 | tee "$RUNNER_TEMP/products.log"
          code=${PIPESTATUS[0]}
          out="$(cat "$RUNNER_TEMP/products.log")"
          {
            echo "## Product signals, ${{ matrix.part }}"
            echo
            echo "exit code \`$code\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
