name: data assemble dataset

# Joins forward outcomes (tools/full_history.py), point-in-time features (the newest sealed
# nbt-pit-features artifact) and the canonical replay setups into one dataset, and writes the
# coverage, leakage, missingness and reproducibility reconciliation (tools/foundation/assemble.py).
# Reads the database, writes nothing to it, and seals everything it produces.
#
# Starts on dispatch or on a push that changes `ops/assemble.json`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ops/assemble.json"]

concurrency:
  group: nbt-assemble
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "not main"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Download the sealed inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sealed
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | [.id,.name,.created_at] | @tsv' > list.tsv
          # newest point-in-time features
          pit="$(awk -F'\t' '$2 ~ /^nbt-pit-features-/' list.tsv | sort -t"$(printf '\t')" -k3 | tail -1 | cut -f1)"
          [ -n "$pit" ] || { echo "no nbt-pit-features artifact: run data-pit-features first"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/artifacts/$pit/zip" > sealed/pit.zip
          # every replay output
          awk -F'\t' '$2 ~ /^nbt-worker-output-/ {print $1" "$2}' list.tsv | while read id name; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "sealed/$name.zip"
          done
          ls sealed | wc -l

      - name: Which runs executed the current replay code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPLAY_CODE="lib jobs/setup.py jobs/sessions.py jobs/nbt.py tools/decide.mjs prisma/schema.prisma requirements.txt"
          echo "{" > runs.json
          first=1
          for z in sealed/nbt-worker-output-*.zip; do
            run="$(basename "$z" .zip)"; run="${run#nbt-worker-output-}"
            sha="$(gh api "repos/${{ github.repository }}/actions/runs/$run" --jq .head_sha)"
            if git diff --quiet "$sha" HEAD -- $REPLAY_CODE; then t=true; else t=false; fi
            [ $first = 1 ] || echo "," >> runs.json; first=0
            echo "\"$run\": {\"sha\": \"$sha\", \"trusted\": $t}" >> runs.json
          done
          echo "}" >> runs.json

      - name: Decrypt, build outcomes, assemble
        env:
          KEY: ${{ secrets.WORKER_ARTIFACT_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          [ -n "$KEY" ] || { echo "WORKER_ARTIFACT_KEY not set"; exit 1; }
          mkdir -p pit replay full dataset
          unzip -q sealed/pit.zip -d sealed/pitenc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY \
            -in sealed/pitenc/pit.tar.gz.enc | tar -xzf - -C pit
          for z in sealed/nbt-worker-output-*.zip; do
            n="$(basename "$z" .zip)"; mkdir -p "sealed/e/$n" "replay/$n"
            unzip -q "$z" -d "sealed/e/$n"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY \
              -in "sealed/e/$n/output.tar.gz.enc" | tar -xzf - -C "replay/$n"
          done
          python tools/full_history.py --out full
          # Unadjusted corporate actions, before the assembly: a stored series that was never
          # rescaled for a split carries a one-day move no holder experienced, and the assembly
          # reads this file to flag every row whose window crosses one.
          python tools/foundation/split_check.py --confirm 60
          python - <<'PY'
          import json
          d = json.load(open("data/foundation/price_verification/unadjusted_actions.json"))
          print("::notice title=unadjusted corporate actions::" + json.dumps(
              {k: v for k, v in d.items() if k != "candidatesList"}))
          PY
          python tools/foundation/assemble.py --full full --pit pit --replay replay --runs runs.json --out dataset
          # The macro state per session, joined on availability rather than on observation date.
          # One row per date, not per asset-session: it is identical across the 616 assets.
          python tools/foundation/macro_pit.py --out dataset/macro
          python - <<'PY'
          import json
          d = json.load(open("dataset/macro/manifest.json"))
          print("::notice title=macro point-in-time::" + json.dumps(
              {k: v for k, v in d.items() if k != "coveragePerSeries"}))
          PY

      # The remaining database-reading reports, run here rather than from a laptop: the Supabase
      # session pooler allows 15 clients, and a local job competing with a running replay slice
      # exhausted it once already. One runner, one connection, after the heavy step.
      - name: Coverage gaps, and whether the source can still serve them
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          python tools/foundation/coverage_gaps.py --probe 120 --out coverage
          python - <<'PY'
          import json
          d = json.load(open("coverage/gaps.json"))
          print("::notice title=coverage gaps::" + json.dumps(
              {k: v for k, v in d.items() if k not in ("worstRuns", "notes", "probeExamples")}))
          PY

      # Survivorship, including the matched-window comparison that needs the database.
      - name: Survivorship bias, measured against the removed names
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          python tools/foundation/survivorship.py
          python - <<'PY'
          import json
          d = json.load(open("data/foundation/survivorship/report.json"))
          print("::notice title=survivorship::" + json.dumps(
              {k: v for k, v in d.items() if k not in ("sample", "caveats")})[:50000])
          PY

      # The pre-registered rules through the purged walk-forward evaluator. Counts and verdicts
      # only in the clear; the dataset it reads stays sealed.
      - name: Evaluate the testable principles
        run: |
          python tools/foundation/evaluate_principles.py --dataset dataset --out evaluation
          python - <<'PY'
          import json
          d = json.load(open("evaluation/principles_evaluation.json"))
          slim = {k: v for k, v in d.items() if k != "results"}
          slim["results"] = {k: {x: v.get(x) for x in
                                 ("trades", "meanNetPct", "meanNetBaseCI95", "verdict", "why",
                                  "deflatedSharpeProbability", "effectiveIndependentTrades")}
                             for k, v in d["results"].items()}
          print("::notice title=principles evaluation::" + json.dumps(slim)[:60000])
          PY

      - name: Seal the dataset
        if: always()
        env:
          KEY: ${{ secrets.WORKER_ARTIFACT_KEY }}
        run: |
          mkdir -p sealed-out bundle bundle/reports
          for d in dataset coverage evaluation; do [ -d "$d" ] && cp -r "$d" bundle/; done
          # These two write into the checkout rather than an output directory, so they would
          # otherwise survive only as the summary in their annotation.
          cp data/foundation/price_verification/unadjusted_actions.json bundle/reports/ 2>/dev/null || true
          cp data/foundation/survivorship/report.json bundle/reports/survivorship.json 2>/dev/null || true
          [ -n "$(ls -A bundle 2>/dev/null)" ] && tar -czf - -C bundle . | openssl enc -aes-256-cbc \
            -pbkdf2 -iter 200000 -salt -pass env:KEY -out sealed-out/dataset.tar.gz.enc || true
          [ -f sealed-out/dataset.tar.gz.enc ] && sha256sum sealed-out/dataset.tar.gz.enc || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbt-dataset-${{ github.run_id }}
          path: sealed-out/dataset.tar.gz.enc
          retention-days: 30
          if-no-files-found: warn
