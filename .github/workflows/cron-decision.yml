name: cron decision

# Decision materialization. This file is the user's requirement in its plainest form: the
# decision never depends on a 40+ minute monolith job finishing perfectly.
#
# It is read-only on prices. It reads the closes the price lanes have already committed and
# writes the decision rows; it fetches nothing and it issues no DDL.
#
# "Fetches nothing" was false between 2026-09 and 2026-10-06 and the lane paid for it. The
# group carried `upcoming`, which calls yfinance once per Yahoo-sourced name with a forced
# half-second sleep. When the universe went from 160 names to 240 on 2026-10-04 the group
# crossed the 20 minute budget, was killed at 1197s, and was killed again the next day --
# so the site's primary output had no rows for two sessions while every input was fresh.
# `upcoming` now rides `cron-calendar.yml`. A claim like the one above is only worth making
# if something enforces it, which is what moving it to FETCH_STEPS in jobs/run.py does. That is what makes it
# independent: it cannot be blocked by a dead venue, a PSX outage or a Trends 429, because it
# never asks any of them anything. If crypto failed two hours ago the decision still
# materializes — from the closes that are stored, which is the only input it ever had.
#
# The practical consequence is the one that matters. In the old shape the decision was a late
# step inside `jobs/run.py daily`, so every upstream source failure arrived at the decision as
# "skipped", and the site's primary output went stale for reasons that had nothing to do with it.
on:
  schedule:
    # Daily at 22:10 UTC. Daily because the decision is a daily reading over daily closes, so a
    # second materialization in the same day recomputes the same answer from the same rows.
    #
    # The hour is chosen for ordering, and the ordering it used to claim was not the one it had.
    # This was 15:10, described as sitting "after the 13:50 US price chunks, so the run reads a
    # day whose closes have landed from both exchanges". The 13:50 fetch does land before 15:10
    # — but 13:50 UTC is twenty minutes after the **open** of a session that runs to 20:00 UTC,
    # so what had landed was a twenty-minute part-day, and the decision read it as that day's
    # close. Being after the price lane is not the same as being after the close, and only the
    # second one is what a daily decision needs.
    #
    # 22:10 is after every input the lane reads:
    #   PSX      closes 11:00 UTC; its file is fetched at 12:40, 16:40 and 20:40, and the last
    #            of those is what makes the day's close available to this run
    #   US       closes 20:00 UTC (21:00 on standard time), fetched post-close at 21:50
    #   crypto   continuous, written every two hours at minute 05
    #
    # FX is the one exception, and it is stated rather than glossed. Measured on AUDUSD=X, Yahoo
    # reports the currency session as 23:00 UTC to **22:59 UTC the next day**, so at 22:10 the
    # current FX day has 49 minutes left to run and `forming_sessions` correctly refuses to store
    # a bar for it. The decision therefore reads FX from its last *complete* day, and picks up the
    # current one at 01:50 the following morning.
    #
    # That is the right trade and not a gap. A daily bar for a session still being traded is not a
    # close -- which is the whole of rule 41 -- so the choice is between yesterday's real number
    # and today's wrong one, and `STALE_AFTER_DAYS.FX` is 4, which this sits comfortably inside.
    # Moving the lane past 22:59 to catch it is what does not work: derive takes up to 30 minutes
    # and decide up to 15, so a 23:10 start finishes after midnight UTC, and `decide.mjs` stamps
    # `periodEnd` from its own clock -- the rows would be dated a day after the closes they read.
    # Hour 22 is even, which this lane can afford where an ingest lane could not: it has its own
    # concurrency group and fetches nothing, so it competes with crypto and news for neither a
    # queue slot nor a provider. Minute 10 stays outside the four recurring minutes (05, 20, 35,
    # 50); the nearest neighbour is news at 22:20, which is a different group.
    #
    # The consequence worth stating: the decision is now published against closes that actually
    # happened. `forming_sessions` in jobs/prices.py is the guard that makes a part-day
    # unstorable, and this schedule is what makes a complete day available in time to be read.
    - cron: "10 22 * * *"
  workflow_dispatch:

# Its own group, and for this lane that is a correctness property rather than a convenience.
# GitHub keeps one pending run per concurrency group, so sharing a group with the ingest lanes
# would mean the decision run could be cancelled while queued behind a source fetch — the
# `geo.py` cancellation, applied to the one output the site is built around. `nbt-decision`
# cannot be cancelled by any source lane.
concurrency:
  group: nbt-decision
  cancel-in-progress: false

jobs:
  # Two jobs and not one, which is the whole point of this file's shape.
  #
  # These used to be two steps of a single job, with the second marked `if: always()` so that a
  # failed derivation still produced decision rows -- "a day with no row at all is a hole in the
  # record that a later hit rate cannot tell apart from a day nothing was decided". That net
  # never caught anything, because `timeout-minutes` kills the *job*: on 2026-10-04 and again on
  # 2026-10-05 the derivation hit 1197s, the runner was cancelled, and the decide step was
  # skipped rather than run. `if: always()` only survives a failed step, never a dead runner.
  #
  # As two jobs with `needs:` and `if: always()`, the writer runs on its own runner with its own
  # budget. A derivation that times out now costs today's *inputs*, not today's decision.
  derive:
    name: derive the inputs a decision is read from
    runs-on: ubuntu-latest
    # Arithmetic over stored rows with no network in it, now that `upcoming` has moved out. The
    # last healthy run of the old group -- which still carried that fetch -- took 16 minutes, so
    # 30 is roughly double what the arithmetic alone should ever need. If this is reached, the
    # query plan is the suspect, not a provider: there is no provider left in this job.
    timeout-minutes: 30
    steps:
      # main, explicitly. A scheduled workflow's file is taken from the default branch, `master`,
      # and its code defaults to the same branch. `master` sat 34 commits behind `main` until
      # 2026-10-03, so the repository's two branch guards had never run despite reading
      # correctly in the working tree.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          want="$(git rev-parse origin/main)"
          echo "checked out $head"
          echo "origin/main  $want"
          if [ "$head" != "$want" ]; then
            echo "this run is NOT executing main, refusing to continue"
            exit 1
          fi
          echo "confirmed: this run is executing main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install job dependencies
        run: pip install -r requirements.txt

      # Checks the schema, never migrates it. `schema.yml` is the one controlled migration path.
      - name: Refuse to run against a schema that is behind
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python jobs/schemacheck.py

      - name: Derive the inputs a decision is read from
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          out="$(python jobs/run.py decision 2>&1)"
          code=$?
          echo "$out"
          {
            echo "## Derivations"
            echo
            echo "exit code \`$code\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # The learning loop's report, every night and with nobody starting it. Every decision is logged
      # and later measured against what the price did +1, +5 and +20 sessions on; this reads those
      # measurements and says, per gate and per confirmation leg, whether the calls were right --
      # with an interval over distinct names, and with no rate printed until enough have matured.
      #
      # It reports and never re-weights. A rule that rewrote its own thresholds from a few weeks of
      # outcomes would be fitting the noise of those weeks, and would do it with nobody reviewing the
      # change; the scorecard is the evidence a person changes a rule on. `continue-on-error`, because
      # a report that cannot run must not stop the decisions it reports on.
      - name: Score past decisions against what followed
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          out="$(python tools/scorecard.py 2>&1)"
          echo "$out"
          {
            echo "## Scorecard"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  decide:
    name: write one decision row per asset
    runs-on: ubuntu-latest
    needs: derive
    # Runs however `derive` ended, including cancelled. A failed or timed-out derivation means
    # some inputs are yesterday's, not that today has no decision -- and a session with no row
    # is a hole a later hit rate cannot tell apart from a session nothing was decided on.
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove this run is executing main
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          want="$(git rev-parse origin/main)"
          if [ "$head" != "$want" ]; then
            echo "this run is NOT executing main, refusing to continue"
            exit 1
          fi
          echo "confirmed: this run is executing main"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --ignore-scripts skips the postinstall `prisma generate`, which this job does not need:
      # decide.mjs talks to Postgres through `pg` directly rather than through the client.
      - name: Install the Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Write one decision row per asset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          out="$(node tools/decide.mjs 2>&1)"
          code=$?
          echo "$out"
          {
            echo "## Decision rows"
            echo
            echo "derive job: ${{ needs.derive.result }}"
            echo
            echo "exit code \`$code\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # The macro gatekeeper: a veto-only layer over the rows just written. Off unless the repository
      # variable MACRO_GATE is "on"; the job prints one line saying so when it is not. The default engine is
      # the local rule table (no key, no cost); the model engine is opt-in with MACRO_GATE_ENGINE=model and
      # then also needs the ANTHROPIC_API_KEY secret.
      #
      # It is `continue-on-error` and the script itself exits 0 whatever happens, because the one
      # thing this layer must never do is turn a third party's outage into a red decision lane. A
      # reply it cannot use is stored as EXECUTE and changes nothing.
      - name: Ask the macro gatekeeper about today's directional names
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MACRO_GATE: ${{ vars.MACRO_GATE }}
          # Empty or unset means the local rule engine: free, offline, deterministic, no key. Only the value
          # "model" asks a language model, and only then is ANTHROPIC_API_KEY read.
          MACRO_GATE_ENGINE: ${{ vars.MACRO_GATE_ENGINE }}
        run: |
          set +e
          out="$(node tools/macro_gate.mjs 2>&1)"
          echo "$out"
          {
            echo "## Macro gate"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The second pass. `decide` reads the stored vetoes as an input, so a name refused above is
      # written as a WAIT now; every row that did not change is skipped by the `IS DISTINCT FROM`
      # guard, so with the gate off this step rewrites nothing.
      - name: Apply the stored vetoes to today's rows
        if: ${{ vars.MACRO_GATE == 'on' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          out="$(node tools/decide.mjs 2>&1)"
          code=$?
          echo "$out"
          {
            echo "## Decision rows, second pass"
            echo
            echo "exit code \`$code\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
